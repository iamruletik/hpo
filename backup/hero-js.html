<script>
  window.addEventListener('DOMContentLoaded', async () => {
    if (
      !window.gsap ||
      !window.SplitType ||
      !window.ScrollTrigger
    ) {
      return;
    }

    gsap.registerPlugin(ScrollTrigger);

    /*
     * Ждём шрифты, чтобы SplitType правильно
     * определил переносы и высоту строк.
     */

    if (document.fonts?.ready) {
      await document.fonts.ready;
    }

    const SELECTORS = {
      heroTitle: '.hero_big-title',
      heroCopy: '.hero_copy-text',

      hardwareTitle: '.hero_hardware-title',
      hardwareSection: '.hero_hardware',
      hardwareBadge: '.hero_hardware-badge',
      hardwareMedia: '.hero_hardware-media',
      hardwareBlur: '.hero_hardware-blur',
      hardwareW: '.hero_mwrapper',

      heroVideo: '.hero-video-wrapper',

      lastWrapper: '.hero_last-wrapper',
      lastTitle: '.hero_last-title',
      lastCopy: '.hero_last-copy',
    };

    function exists(target) {
      return gsap.utils.toArray(target).length > 0;
    }

    function splitLinesWithMask(selector) {
      if (!exists(selector)) return [];

      const split = new SplitType(selector, {
        types: 'lines',
        lineClass: 'line',
      });

      split.lines.forEach((line) => {
        const mask = document.createElement('div');

        mask.classList.add('line-mask');

        line.parentNode.insertBefore(mask, line);
        mask.appendChild(line);
      });

      gsap.set(selector, {
        visibility: 'visible',
      });

      return split.lines;
    }

    function createRevealAnimation(
      target,
      fromVars,
      toVars,
      scrollTriggerVars = {},
    ) {
      if (!exists(target)) return null;

      gsap.set(target, {
        willChange: 'transform, opacity',
        force3D: true,
      });

      return gsap.fromTo(
        target,
        {
          ...fromVars,
          force3D: true,
        },
        {
          duration: 1,
          ease: 'power3.out',
          overwrite: 'auto',
          force3D: true,
          ...toVars,

          scrollTrigger: {
            trigger: SELECTORS.hardwareSection,
            start: 'top center',
            toggleActions: 'play none none none',
            once: true,
            invalidateOnRefresh: true,
            ...scrollTriggerVars,
          },
        },
      );
    }

    /*
     * Разбиваем тексты на строки до окончания прелоадера,
     * чтобы при его исчезновении не было скачка или мигания.
     */

    const heroTitleLines = splitLinesWithMask(
      SELECTORS.heroTitle,
    );

    const heroCopyLines = splitLinesWithMask(
      SELECTORS.heroCopy,
    );

    const hardwareTitleLines = splitLinesWithMask(
      SELECTORS.hardwareTitle,
    );

    const lastTitleLines = splitLinesWithMask(
      SELECTORS.lastTitle,
    );

    const lastCopyLines = splitLinesWithMask(
      SELECTORS.lastCopy,
    );

    /*
     * Начальные состояния.
     */

    const heroLines = [
      ...heroTitleLines,
      ...heroCopyLines,
      ...lastTitleLines,
      ...lastCopyLines,
    ];

    gsap.set(heroLines, {
      yPercent: 110,
      opacity: 1,
      willChange: 'transform',
      force3D: true,
    });

    gsap.set(hardwareTitleLines, {
      yPercent: 100,
      opacity: 0,
      willChange: 'transform, opacity',
      force3D: true,
    });

    /*
     * Вступительная анимация Hero.
     * paused: true — не запускаем её до завершения прелоадера.
     */

    const introTl = gsap.timeline({
      paused: true,

      defaults: {
        duration: 1.15,
        ease: 'expo.out',
      },

      onComplete: () => {
        gsap.set(
          [...heroTitleLines, ...heroCopyLines],
          {
            clearProps: 'willChange',
          },
        );
      },
    });

    introTl
      .to(heroTitleLines, {
        yPercent: 0,
        stagger: 0.2,
      })
      .to(
        heroCopyLines,
        {
          yPercent: 0,
          stagger: 0.12,
        },
        '-=1.05',
      );

    /*
     * Запускаем intro только после полного удаления прелоадера.
     */

    let introStarted = false;

    function startHeroIntro() {
      if (introStarted) return;

      introStarted = true;

      requestAnimationFrame(() => {
        introTl.play(0);
        ScrollTrigger.refresh();
      });
    }

    /*
     * window.preloaderFinished устанавливается
     * внутри скрипта прелоадера.
     *
     * Дополнительная проверка наличия .preloader нужна,
     * если прелоадер отключён или уже удалён.
     */

    if (
      window.preloaderFinished ||
      !document.querySelector('.preloader')
    ) {
      startHeroIntro();
    } else {
      window.addEventListener(
        'preloader:complete',
        startHeroIntro,
        { once: true },
      );
    }

    /*
     * Hardware title.
     */

    createRevealAnimation(
      hardwareTitleLines,
      {
        yPercent: 100,
        opacity: 0,
      },
      {
        yPercent: 0,
        opacity: 1,
        duration: 1,
        ease: 'expo.out',
        stagger: 0.2,
      },
      {
        trigger: SELECTORS.hardwareSection,
        start: 'top-=300 center',
      },
    );

    /*
     * Hardware badge.
     */

    createRevealAnimation(
      SELECTORS.hardwareBadge,
      {
        yPercent: 100,
        scale: 0,
        opacity: 0,
        transformOrigin: '50% 100%',
      },
      {
        yPercent: 0,
        scale: 1,
        opacity: 1,
        transformOrigin: '50% 100%',
        duration: 0.9,
        ease: 'power3.out',
      },
      {
        trigger: SELECTORS.hardwareSection,
        start: 'top-=150 center',
      },
    );

    /*
     * Hardware media и blur.
     */

    const hardwareMedia = document.querySelector(
      SELECTORS.hardwareMedia,
    );

    const hardwareBlur = document.querySelector(
      SELECTORS.hardwareBlur,
    );

    if (hardwareMedia) {
      gsap.set(hardwareMedia, {
        maxHeight: 0,
        yPercent: 50,
        opacity: 0.9,
        overflow: 'hidden',
        willChange: 'max-height, transform, opacity',
        force3D: true,
      });

      if (hardwareBlur) {
        gsap.set(hardwareBlur, {
          height: '20rem',
          overflow: 'hidden',
          willChange: 'height',
        });
      }

      const mediaTl = gsap.timeline({
        scrollTrigger: {
          trigger: SELECTORS.hardwareSection,
          start: 'top-=50 center',
          toggleActions: 'play none none none',
          once: true,
          invalidateOnRefresh: true,
        },
      });

      /*
       * Раскрытие высоты и движение media
       * начинаются одновременно.
       */

      mediaTl
        .to(
          hardwareMedia,
          {
            maxHeight: () => hardwareMedia.scrollHeight,
            duration: 1.3,
            ease: 'power3.inOut',
          },
          0,
        )
        .to(
          hardwareMedia,
          {
            yPercent: 0,
            opacity: 1,
            duration: 0.5,
            ease: 'power3.out',
            force3D: true,
          },
          0,
        )
        .set(hardwareMedia, {
          maxHeight: 'none',
          clearProps: 'overflow,willChange',
        });

      /*
       * Blur начинает уменьшаться ближе
       * к завершению раскрытия media.
       */

      if (hardwareBlur) {
        mediaTl
          .to(
            hardwareBlur,
            {
              height: '0rem',
              duration: 1.4,
              ease: 'power3.out',
            },
            '-=0.4',
          )
          .set(hardwareBlur, {
            clearProps: 'overflow,willChange',
          });
      }
    }

    /*
     * Увеличение Hero video.
     */

    if (exists(SELECTORS.heroVideo)) {
      gsap.to(SELECTORS.heroVideo, {
        width: '100vw',
        height: '100vh',
        left: '0px',
        top: '0px',
        borderRadius: '0rem',
        duration: 1.1,
        ease: 'power3.inOut',

        scrollTrigger: {
          trigger: 'body',
          start: 'top+=100 top',
          toggleActions: 'play none none none',
          once: true,
          invalidateOnRefresh: true,
        },
      });
    }

    /*
     * Последний заголовок Hero.
     */

    if (
      lastTitleLines.length &&
      exists(SELECTORS.lastWrapper)
    ) {
      gsap.fromTo(
        lastTitleLines,
        {
          yPercent: 100,
        },
        {
          yPercent: 0,
          stagger: 0.1,
          duration: 0.9,
          ease: 'power3.out',

          scrollTrigger: {
            trigger: SELECTORS.lastWrapper,
            start: 'top-=150 center',
            toggleActions: 'play none none none',
            once: true,
            invalidateOnRefresh: true,
          },
        },
      );
    }

    /*
     * Последний текст Hero.
     */

    if (
      lastCopyLines.length &&
      exists(SELECTORS.lastWrapper)
    ) {
      gsap.fromTo(
        lastCopyLines,
        {
          yPercent: 100,
        },
        {
          yPercent: 0,
          stagger: 0.1,
          duration: 0.9,
          ease: 'power3.out',

          scrollTrigger: {
            trigger: SELECTORS.lastWrapper,
            start: 'top-=150 center',
            toggleActions: 'play none none none',
            once: true,
            invalidateOnRefresh: true,
          },
        },
      );
    }

    ScrollTrigger.refresh();
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const sectionHero = document.querySelector('.section_hero');
    const videoWrapper = document.querySelector('.hero-video-wrapper');
    const videoEmbed = document.querySelector('.hero-video-embed');

    // Проверяем, существуют ли элементы на странице, чтобы избежать ошибок
    if (sectionHero && videoWrapper && videoEmbed) {
      gsap.to(videoEmbed, {
        // Используем функцию, чтобы значение пересчитывалось при ресайзе
        y: () => {
          const heightVideoWrapper = videoWrapper.offsetHeight;
          const heightVideoEmbed = videoEmbed.offsetHeight;
          const totalHeight = heightVideoEmbed - heightVideoWrapper;
          return -totalHeight;
        },
        ease: 'none', // Отключаем стандартное смягчение GSAP, чтобы scrub работал равномерно
        scrollTrigger: {
          trigger: sectionHero,
          start: 'top top', // Анимация начнется, когда верх секции коснется верха экрана (настройте под себя)
          end: 'bottom bottom', // Закончится, когда низ секции коснется верха экрана
          scrub: 1, // Значение больше 0 дает плавное "догоняющее" сглаживание
          invalidateOnRefresh: true, // Обязательно для пересчета высот при ресайзе
        },
      });
    }
  });
</script>
