<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!window.gsap) {
      console.error('GSAP не загрузился');
      return;
    }

    const IDLE_DASH = 0.2;
    const FULL_DASH = 1;

    document.querySelectorAll('.demo-button').forEach((button) => {
      const paths = Array.from(
        button.querySelectorAll('.demo-button__active path')
      );

      const texts = Array.from(
        button.querySelectorAll('.demo-button__text')
      );

      if (!paths.length || texts.length !== 2) {
        console.warn('Неправильная структура .demo-button', button);
        return;
      }

      let currentTextIndex = 0;
      let textTimeline = null;
      let borderTween = null;

      let isActive = false;
      let isPointerInside = false;
      let isFocused = false;

      /*
       * Числовое состояние SVG-обводки.
       * Так GSAP не интерполирует строковый stroke-dasharray
       * и значение никогда не сбрасывается в 0.
       */
      const dashState = {
        value: IDLE_DASH
      };

      function updateBorder() {
        const value = Math.max(
          IDLE_DASH,
          Math.min(FULL_DASH, dashState.value)
        );

        const formattedValue = Number(value.toFixed(4));

        paths.forEach((path) => {
          path.style.strokeDasharray = `${formattedValue} 1`;
          path.style.strokeDashoffset = '0';
        });
      }

      /*
       * Начальное состояние обводки.
       */
      updateBorder();

      /*
       * Начальное состояние текстов.
       */
      gsap.set(texts[0], {
        yPercent: 0
      });

      gsap.set(texts[1], {
        yPercent: 115
      });

      function finishRunningTextAnimation() {
        if (!textTimeline) return;

        const timeline = textTimeline;
        textTimeline = null;

        /*
         * progress(1) может запустить onComplete,
         * поэтому сохраняем timeline в отдельную переменную.
         */
        timeline.progress(1);
        timeline.kill();
      }

      function rollText() {
        finishRunningTextAnimation();

        const outgoing = texts[currentTextIndex];
        const nextTextIndex = currentTextIndex === 0 ? 1 : 0;
        const incoming = texts[nextTextIndex];

        gsap.set(incoming, {
          yPercent: 115
        });

        const timeline = gsap.timeline({
  defaults: {
    duration: 0.5,
    ease: 'power4.inOut',
    overwrite: true
  },

  /*
   * Во время движения каждого текста пересчитываем,
   * где проходит граница светлой и тёмной секции.
   */
  onUpdate: () => {
    window.requestChameleonButtonsUpdate?.();
  },

  onComplete: () => {
    gsap.set(outgoing, {
      yPercent: 115
    });

    currentTextIndex = nextTextIndex;

    window.requestChameleonButtonsUpdate?.();

    if (textTimeline === timeline) {
      textTimeline = null;
    }
  }
});

        textTimeline = timeline;

        timeline
          .to(
            outgoing,
            {
              yPercent: -115
            },
            0
          )
          .to(
            incoming,
            {
              yPercent: 0
            },
            0
          );
      }

      function stopBorderTween() {
        if (!borderTween) return;

        borderTween.kill();
        borderTween = null;
      }

      function drawBorder() {
        stopBorderTween();

        borderTween = gsap.to(dashState, {
          value: FULL_DASH,
          duration: 0.62,
          ease: 'power2.inOut',
          overwrite: true,

          onUpdate: updateBorder,

          onComplete: () => {
            dashState.value = FULL_DASH;
            updateBorder();
            borderTween = null;
          }
        });
      }

      function retractBorder() {
        stopBorderTween();

        /*
         * Анимация начинается с текущего значения dashState.value
         * и заканчивается строго на 0.2, а не на 0.
         */
        borderTween = gsap.to(dashState, {
          value: IDLE_DASH,
          duration: 0.36,
          ease: 'power3.inOut',
          overwrite: true,

          onUpdate: updateBorder,

          onComplete: () => {
            dashState.value = IDLE_DASH;
            updateBorder();
            borderTween = null;
          }
        });
      }

      function syncActiveState() {
        const nextActive = isPointerInside || isFocused;

        if (nextActive === isActive) return;

        isActive = nextActive;

        if (isActive) {
          drawBorder();
          rollText();
        } else {
          retractBorder();
        }
      }

      button.addEventListener('pointerenter', () => {
        isPointerInside = true;
        syncActiveState();
      });

      button.addEventListener('pointerleave', () => {
        isPointerInside = false;
        syncActiveState();
      });

      button.addEventListener('focus', () => {
        isFocused = true;
        syncActiveState();
      });

      button.addEventListener('blur', () => {
        isFocused = false;
        syncActiveState();
      });

      button.addEventListener('click', (event) => {
        /*
         * Удали preventDefault(), когда добавишь
         * кнопке настоящий URL или открытие модального окна.
         */
        event.preventDefault();
      });
    });
  });
</script>
<script>
  (() => {
    function initSecondaryButtonRoll() {
      if (!window.gsap) {
        console.error(
          '[Secondary Button] GSAP не загрузился'
        );

        return;
      }

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      const buttons = document.querySelectorAll(
        '[data-chameleon-btn].button.is-secondary'
      );

      buttons.forEach((button) => {
        if (
          button.dataset.secondaryRollReady === 'true'
        ) {
          return;
        }

        const label = button.querySelector(
          '.chameleon-text'
        );

        if (!label) {
          console.warn(
            '[Secondary Button] .chameleon-text не найден',
            button
          );

          return;
        }

        button.dataset.secondaryRollReady = 'true';

        /*
         * Сохраняем доступное название кнопки.
         */
        const originalText =
          label.textContent.trim() || 'Explore';

        if (!button.getAttribute('aria-label')) {
          button.setAttribute(
            'aria-label',
            originalText
          );
        }

        label.setAttribute('aria-hidden', 'true');
        label.classList.add('is-roll-label');

        let texts = Array.from(
          label.querySelectorAll(
            '.demo-button__text'
          )
        );

        /*
         * Автоматически создаём два текстовых слоя,
         * если их ещё нет.
         */
        if (texts.length !== 2) {
          const firstText =
            document.createElement('span');

          const secondText =
            document.createElement('span');

          firstText.className =
            'demo-button__text';

          secondText.className =
            'demo-button__text';

          firstText.textContent = originalText;
          secondText.textContent = originalText;

          label.replaceChildren(
            firstText,
            secondText
          );

          texts = [firstText, secondText];
        }

        if (reduceMotion) {
          gsap.set(texts[0], {
            yPercent: 0
          });

          gsap.set(texts[1], {
            yPercent: 115
          });

          window
            .requestChameleonButtonsUpdate?.();

          return;
        }

        let currentTextIndex = 0;
        let textTimeline = null;

        let isActive = false;
        let isPointerInside = false;
        let isFocused = false;

        gsap.set(texts[0], {
          yPercent: 0
        });

        gsap.set(texts[1], {
          yPercent: 115
        });

        function requestChameleonUpdate() {
          window
            .requestChameleonButtonsUpdate?.();
        }

        function finishRunningAnimation() {
          if (!textTimeline) return;

          const timeline = textTimeline;

          textTimeline = null;

          /*
           * Завершаем текущий переход без ошибки null.kill().
           */
          timeline.progress(1);
          timeline.kill();

          requestChameleonUpdate();
        }

        function rollText() {
          finishRunningAnimation();

          const outgoing =
            texts[currentTextIndex];

          const nextTextIndex =
            currentTextIndex === 0 ? 1 : 0;

          const incoming =
            texts[nextTextIndex];

          gsap.set(incoming, {
            yPercent: 115
          });

          const timeline = gsap.timeline({
            defaults: {
              duration: 0.5,
              ease: 'power4.inOut',
              overwrite: true
            },

            /*
             * Пересчитываем chameleon-градиент,
             * пока тексты физически перемещаются.
             */
            onUpdate: requestChameleonUpdate,

            onComplete: () => {
              gsap.set(outgoing, {
                yPercent: 115
              });

              currentTextIndex =
                nextTextIndex;

              if (textTimeline === timeline) {
                textTimeline = null;
              }

              requestChameleonUpdate();
            }
          });

          textTimeline = timeline;

          timeline
            .to(
              outgoing,
              {
                yPercent: -115
              },
              0
            )
            .to(
              incoming,
              {
                yPercent: 0
              },
              0
            );
        }

        function syncActiveState() {
          const nextActive =
            isPointerInside || isFocused;

          if (nextActive === isActive) {
            return;
          }

          isActive = nextActive;

          if (isActive) {
            rollText();
          }
        }

        button.addEventListener(
          'pointerenter',
          () => {
            isPointerInside = true;
            syncActiveState();
          }
        );

        button.addEventListener(
          'pointerleave',
          () => {
            isPointerInside = false;
            syncActiveState();
          }
        );

        button.addEventListener(
          'focus',
          () => {
            isFocused = true;
            syncActiveState();
          }
        );

        button.addEventListener(
          'blur',
          () => {
            isFocused = false;
            syncActiveState();
          }
        );

        requestChameleonUpdate();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener(
        'DOMContentLoaded',
        initSecondaryButtonRoll,
        {
          once: true
        }
      );
    } else {
      initSecondaryButtonRoll();
    }
  })();
</script>
